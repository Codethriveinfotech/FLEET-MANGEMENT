ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.vehicletrackingapp.backend.ApplicationKt.module ]
    }
}

jwt {
    secret = "your_super_secret_key_here"
    secret = ${?JWT_SECRET}
    issuer = "http://0.0.0.0:8080"
    issuer = ${?JWT_ISSUER}
    audience = "http://0.0.0.0:8080"
    audience = ${?JWT_AUDIENCE}
    realm = "Access to 'Vehicle Tracking App'"
}

database {
    url = "jdbc:postgresql://localhost:5432/neondb"
    url = ${?DATABASE_URL}
    user = "postgres"
    user = ${?DATABASE_USER}
    password = "password"
    password = ${?DATABASE_PASSWORD}
}
