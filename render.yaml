services:
  - type: web
    name: vehicle-tracking-backend
    env: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vehicle-tracking-db
          property: connectionString
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: "https://your-render-app-url.onrender.com"
      - key: JWT_AUDIENCE
        value: "https://your-render-app-url.onrender.com"

databases:
  - name: vehicle-tracking-db
    plan: free
    region: oregon
